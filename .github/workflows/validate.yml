name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate repository
        run: python scripts/repo_check.py
      - name: Check helper CLIs
        run: |
          python scripts/init_project.py --help
          python scripts/moss_tts.py --help
          python scripts/validate_delivery.py --help
